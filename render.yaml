# Render Blueprint, FREE DEMO MODE: one free web service, no worker, no Redis.
# Background jobs run inside the request (CELERY_TASK_ALWAYS_EAGER), so the nightly reconcile and
# automatic failed-webhook replay are off. The first request after 15 minutes idle takes 30-60s.
# For the full setup (worker + beat + Redis) use render.paid.yaml.
# Database is Neon: paste its pooled connection string as DATABASE_URL.
services:
  - type: web
    name: shopsync-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: DATABASE_URL
        sync: false # Neon pooled connection string, ending in ?sslmode=require
      - key: ALLOWED_HOSTS
        sync: false # e.g. shopsync-api.onrender.com
      - key: APP_URL
        sync: false # https://shopsync-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # https://shopsync-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://your-dashboard.vercel.app (set after Vercel, then redeploy)
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        value: read_products,write_products,read_inventory,write_inventory,read_orders,read_locations
