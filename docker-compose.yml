services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shopsync
      POSTGRES_PASSWORD: shopsync
      POSTGRES_DB: shopsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend: &backend
    build: ./backend
    env_file: [.env]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *backend
    command: celery -A config worker -l info
    ports: []

  beat:
    <<: *backend
    command: celery -A config beat -l info
    ports: []

volumes:
  pgdata:
